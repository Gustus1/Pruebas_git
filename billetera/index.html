<!DOCTYPE html>
<html>
<head>
  <title>Wallet - Login</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <style>
    body {
      padding: 20px;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center">Inicio de sesión</h2>
    <form action="">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" class="form-control" id="email" placeholder="Ingrese email">
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" class="form-control" id="password" placeholder="Ingrese password">
      </div>
      <button type="submit" class="btn btn-primary" onclick="iniciar_sesion()">Iniciar sesión</button>
    </form>
    <!--<a href="menu.html" class="btn btn-secondary my-3">Ir al Menú Principal</a>-->
  </div>
  <script src="./script_index.js"></script>
</body>
</html>
